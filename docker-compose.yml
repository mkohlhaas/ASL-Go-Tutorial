services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tutorial
      POSTGRES_PASSWORD: tutorial
      POSTGRES_DB: tutorial
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutorial -d tutorial"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
